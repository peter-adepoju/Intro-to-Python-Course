<div class="wrap narrow">
  <h1>Settings</h1>
  <p class="lede">Make the course comfortable for you. Settings are saved on this device straight away, and follow you to every device when you're signed in.</p>
  <div id="settings"></div>
  <section class="settings-group">
    <h2>Preview</h2>
    <p>This is how lesson text looks. Below is a code box at your chosen code size.</p>
    <div class="pc pc-example settings-preview" data-kind="example" data-id=""><textarea class="pc-src pc-code" hidden>name = "Ada"
message = f"Hello, {name}! This line is long enough to show what line wrapping does when it is switched on."
print(message)</textarea></div>
  </section>
  <p><button type="button" class="btn btn-quiet" id="reset-settings">Restore defaults</button></p>
</div>
